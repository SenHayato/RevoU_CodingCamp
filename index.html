<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SenHayato Latihan HTML</title>
</head>
<body>
    <h1>Ini Heading 1</h1>
    <h2>Ini Heading 2 SenHayato</h2>
    <p>Ini Paragraph 1</p>
    <hr>
    <p>Ini Paragraph 2</p>
    <progress>100%</progress>
    <br>
    <p>Ini Paragraph 3
        <br> <b>Malubulul</b> <i>Ini italic</i> <u>Ini underscore</u> <sub>Ini agak turun (sub)</sub><sup>22 Ini (sup)</sup>
        <!-- Ini adalah komentar -->
    </p>
    <p style="color: rgb(55, 149, 46);">Ini Paragraph 4</p>
</body>
</html>

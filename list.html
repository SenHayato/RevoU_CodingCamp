<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
    <h2 style="color: blue;">Unorder List (ul)</h2>
    <ul>
        <li style="color: red;">Nikke</li>
        <li style="font-size:x-large;">Honkai Impact</li>
        <li style="background-color:rgb(112, 192, 224);">Blue Archive</li>
        <li type="square">Azur Lane</li>
    </ul>
    <hr>
    <h2 style="color: chocolate;">Ordered List (ol)</h2>
    <ol type="a">
         <li style="color: red;">Nikke</li>
        <li style="font-size:x-large;">Honkai Impact</li>
        <li type="I"style="background-color:rgb(112, 192, 224);">Blue Archive</li>
        <li type="1">Azur Lane</li>
    </ol>
</body>
</html>
